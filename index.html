<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eShop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="logo">eShop</a>
    <nav>
    <nav>
      <a href="#">Products</a>
      <a href="#" id="cart-link" class="cart-link">Cart (<span id="cart-count">0</span>)</a>
      <span id="auth-links" class="auth-links"></span>
    </nav>

        </nav>
  </header>

  <main class="container">
    <h1>Products</h1>

    <div class="controls">
      <input type="search" id="search-input" placeholder="Search products...">

      <select id="category-select">
        <option value="all">All categories</option>
      </select>

      <select id="sort-select">
        <option value="default">Sort: Featured</option>
        <option value="price-asc">Price: low → high</option>
        <option value="price-desc">Price: high → low</option>
        <option value="name-asc">Name: A → Z</option>
        <option value="name-desc">Name: Z → A</option>
      </select>
    </div>

    <p id="results-count" class="results-count"></p>

    <!-- JavaScript fills this element with product cards -->
    <section id="product-grid" class="product-grid"></section>
  </main>

  <aside id="cart-panel" class="cart-panel">
    <h2>Your cart</h2>
    <ul id="cart-items" class="cart-items"></ul>
    <p class="cart-total">Total: <strong id="cart-total">0,00 €</strong></p>
  </aside>

  <footer class="footer">
    <p>eShop · Built by Elianna Kalodimou</p>
  </footer>

  <!-- Order matters: data, then shared cart code, then this page's code -->
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
